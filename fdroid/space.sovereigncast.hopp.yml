# Not used by our build; kept here so it changes together with the build.
# ADR 0011: one key everywhere — F-Droid publishes OUR signed APK (Binaries)
# once its own build from source matches it (AllowedAPKSigningKeys).
# Summary, description, icon and screenshots come from fastlane/ in the repo.
# How to submit: docs/fdroid.md.

