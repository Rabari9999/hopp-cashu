# Runs on Hopp's own runner only (ADR 0017): tag "hopp", image built locally.
# Build only when something that goes into the app changed — documentation
# commits do not tie up the (single-job) build box. Tags and manual runs
# always build.
#
# No pipeline in a fork: it has no runner tagged "hopp", so its jobs would
# hang or fail and paint a contributor's MR red for nothing. A fork's MR is
# tested here instead — a maintainer starts its pipeline in nodesignal/hopp
# after reading it (CONTRIBUTING.md).
workflow:
  rules:
    - if: $CI_PROJECT_PATH != "nodesignal/hopp"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    # A branch with an open MR gets the MR pipeline only — the push ran the
    # same two jobs on the same commit a second time (!6, 2026-10-21).
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - changes:
        - shared/**/*
        - androidApp/**/*
        - iosApp/**/*
        - gradle/**/*
        - "*.gradle.kts"
        - gradle.properties
        - ci/**/*
        - .gitlab-ci.yml

default:
  image: hopp-ci:1
  tags: [hopp]

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: /cache/gradle

stages: [test, build, release]

# Every job shares one Gradle home in the runner's cache, and Gradle hands its
# cache locks over between processes by pinging them — which does not reach
# into another job's container. Two jobs at once (two pipelines, the runner
# has concurrent = 2) left one waiting on the journal lock until it failed
# (2026-10-14). resource_group: gradle-cache runs them one after the other.

shared-tests:
  stage: test
  resource_group: gradle-cache
  script:
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - ./gradlew --console=plain :shared:jvmTest
    # Kotlin/Native builds Apple klibs on Linux too (linking needs a Mac):
    # catches iOS compile errors without one.
    - ./gradlew --console=plain :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64
  artifacts:
    when: always
    reports:
      junit: shared/build/test-results/jvmTest/*.xml

android-debug:
  stage: build
  resource_group: gradle-cache
  script:
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    # Robolectric fetches its Android jars into ~/.m2 — keep them across jobs.
    - mkdir -p /cache/m2 && ln -sfn /cache/m2 ~/.m2
    # The app on Android's own Compose, lifecycle and SQLite, no device.
    - ./gradlew --console=plain :androidApp:testFossDebugUnitTest
    - ./gradlew --console=plain :androidApp:assembleFossDebug :androidApp:assemblePlayDebug
    # A beta only with the beta key (security audit 2026-10-22, H-04; docs/signing.md). GitLab
    # variables hold text, the keystore is binary: it comes as base64 and is written out here —
    # outside the project, readable by this user only, and gone however the build ends (delta
    # audit 2026-10-22, MN-09). In a subshell, so the trap fires when it ends.
    - |
      if [ -n "$HOPP_BETA_KEYSTORE_BASE64" ]; then
        (
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$HOPP_BETA_KEYSTORE_BASE64" | base64 -d > "$key"
          HOPP_BETA_KEYSTORE="$key" ./gradlew --console=plain :androidApp:assembleFossBeta
        )
      else
        echo "No beta key here: no beta built."
      fi
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - androidApp/build/outputs/apk/*/debug/*.apk
      # Release code, the beta key: the build testers get and judge smoothness with.
      - androidApp/build/outputs/apk/*/beta/*.apk
    reports:
      junit: androidApp/build/test-results/testFossDebugUnitTest/*.xml

# On a release tag: unsigned release builds (ADR 0017). The maintainer signs
# locally; scripts/compare_apks.py (or `apksigcopier compare`, which F-Droid
# uses) then checks that the signed APK is this build plus a signature.
release-unsigned:
  stage: release
  resource_group: gradle-cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9.]+$/
  script:
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - ./gradlew --console=plain :androidApp:assembleFossRelease :androidApp:bundlePlayRelease
  artifacts:
    expire_in: never
    paths:
      - androidApp/build/outputs/apk/foss/release/*.apk
      - androidApp/build/outputs/bundle/playRelease/*.aab
