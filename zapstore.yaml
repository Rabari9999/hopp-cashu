name: Hopp
summary: Honest open podcast player — Podcasting 2.0 with value for value over Lightning
description: |
  Hopp is a podcast player for every podcast, built for Podcasting 2.0 and
  value for value. No account, no tracking, no server of its own: install it
  and listen.

  Connect your own Lightning wallet and boost the shows you love, or stream
  sats while you listen – Hopp never holds your sats and takes no cut. With an
  optional Nostr identity you comment on episodes and keep your devices in
  sync, encrypted.

  **Listening**

  - ✅ Home with what is new and your playlist, library as cards or a list, sorted with tags of your own
  - ✅ A playlist – what plays on top, what comes next below, reorderable – downloads on Wi-Fi, sleep timer, skip silence, your own skip intervals
  - ✅ Speed, intro and outro skipping for each show; quiet shows made louder
  - ✅ Chapters with pictures, transcripts that read along, people, show notes, clips
  - ✅ Tap a person to see every episode with them
  - ✅ Listening statistics: time, time saved, top shows and episodes, sats given
  - ✅ Home screen widget, lock screen and Android Auto
  - ✅ Share Hopp's link, the website, the audio link or the file itself

  **Value for value**

  - ✅ Your own Lightning wallet over Nostr Wallet Connect (NWC) – no built-in wallet
  - ✅ Boost an episode or a whole show, quick boost from the lock screen, stream sats per minute
  - ✅ A daily budget you set, payment history with who got what
  - ✅ 100 % to the podcasters, routing fees shown apart; supporting Hopp is your choice

  **Nostr**

  - ✅ Optional and off until you turn it on: see what your Nostr contacts listen to, boost and comment on; share your subscriptions with mutual contacts, sealed so only they can read them
  - ✅ Comments on every episode, Fountain's included: write, like and zap – publicly, privately or anonymously
  - ✅ Identity made in Hopp, imported or kept in Amber or another signer; profile name and picture set in Hopp; your own relays
  - ✅ Sync between your devices: subscriptions, progress, favourites, playlist, settings, statistics – encrypted, no Hopp server
  - ✅ Restore your library on a new device

  **Discover**

  - ✅ Podcast Index: search, categories, your shows' recommendations, new shows that take sats, popular right now
  - ✅ Optionally fyyd and Apple, a feed address, OPML import and export – moving over from another app is easy

  **Sovereigncast shows**

  - ✅ Release Boosting, Boost2Unlock, topic suggestions and votes, top boosts and top episodes

  **Privacy and more**

  - ✅ A privacy page: who sees what when you listen, and what you can do about it
  - ✅ Notifications for boosts and zaps, set for each on its own
  - ✅ Phones and tablets, upright and sideways, light and dark, English and German, Spanish as a preview

  Hopp is open source (MIT).
tags:
  - podcast
  - lightning
  - bitcoin
  - value4value
  - nostr
license: MIT
website: https://hopp.sovereigncast.space

