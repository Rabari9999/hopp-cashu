name: Hopp
summary: Honest open podcast player — Podcasting 2.0 with value for value over Lightning
description: |
  Hopp is a podcast player without an account, for Podcasting 2.0 and value
  for value: connect your Lightning wallet over NWC, boost an episode or a
  whole show, and stream sats while you listen — within a daily budget you
  set. Hopp takes no cut and collects nothing.

  - Library, Home with what is new and what you are listening to, queue,
    downloads on Wi-Fi, sleep timer, speed per show, skip silence, Android Auto
  - Discover by category, from your shows' recommendations, new shows that
    take sats and what is popular — from the Podcast Index (optionally fyyd
    and Apple), by feed address or OPML
  - Chapters, transcripts, people, show notes
  - Sovereigncast shows: Release Boosting, Boost2Unlock, votes, top boosts
  - Comments on every episode over Nostr, Fountain's too: write, like and zap
    them — publicly, privately or anonymously — with an identity made in
    Hopp, imported or kept in Amber; boosts as comments if you like; your own
    relays
  - Notifications for boosts and zaps, set for each on its own
  - Phones and tablets; a privacy page explains who sees what

  In English and German.
tags:
  - podcast
  - lightning
  - bitcoin
  - value4value
  - nostr
license: MIT
website: https://hopp.sovereigncast.space

