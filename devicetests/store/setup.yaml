# Store screenshots, part 1: Hopp filled the way a listener would — Nodesignal
# and the shows its podroll recommends (as it stands, 2026-10-20), found by
# name. English UI.
appId: ${APP_ID}
name: Store setup
---
- runFlow: ../flows/common/fresh.yaml
- tapOn: "Discover"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- tapOn: "Search or feed address"
- inputText: "Nodesignal"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Nodesignal - Deine Bitcoin-Frequenz"
    timeout: 30000
- tapOn: "Nodesignal - Deine Bitcoin-Frequenz"
- extendedWaitUntil:
    visible: "Subscribe"
    timeout: 30000
- tapOn: "Subscribe"
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 60000
- tapOn: "Back"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- tapOn: "Search or feed address"
- inputText: "Münzweg"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Münzweg - der Bitcoin-Podcast"
    timeout: 30000
- tapOn: "Münzweg - der Bitcoin-Podcast"
- extendedWaitUntil:
    visible: "Subscribe"
    timeout: 30000
- tapOn: "Subscribe"
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 60000
- tapOn: "Back"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- tapOn: "Search or feed address"
- inputText: "Sound Money Bitcoin"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Sound Money Bitcoin Podcast"
    timeout: 30000
- tapOn: "Sound Money Bitcoin Podcast"
- extendedWaitUntil:
    visible: "Subscribe"
    timeout: 30000
- tapOn: "Subscribe"
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 60000
- tapOn: "Back"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- tapOn: "Search or feed address"
- inputText: "Honigdachs"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Honigdachs"
    timeout: 30000
- tapOn: "Honigdachs"
- extendedWaitUntil:
    visible: "Subscribe"
    timeout: 30000
- tapOn: "Subscribe"
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 60000
- tapOn: "Back"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- tapOn: "Search or feed address"
- inputText: "Bitcoin Socratic Seminar"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Bitcoin Socratic Seminar Online"
    timeout: 30000
- tapOn: "Bitcoin Socratic Seminar Online"
- extendedWaitUntil:
    visible: "Subscribe"
    timeout: 30000
- tapOn: "Subscribe"
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 60000
- tapOn: "Back"
- waitForAnimationToEnd
# Nodesignal's own playback, as the per-show page shows it: 1.3×, its intro skipped.
- tapOn: "Home"
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: "Playback"
    centerElement: true
- tapOn: "Playback"
- scrollUntilVisible:
    element: "Per show"
    centerElement: true
- tapOn: "Per show"
- extendedWaitUntil:
    visible: "Nodesignal.*"
    timeout: 15000
- tapOn: "Nodesignal.*"
- extendedWaitUntil:
    visible: "Skip the intro"
    timeout: 10000
- tapOn:
    text: "1.3×"
    below: "Speed"
    above: "Skip the intro"
- scrollUntilVisible:
    element: "Skip the outro"
- tapOn:
    text: "30 s"
    below: "Skip the intro"
    above: "Skip the outro"
- swipe:
    from: "Drag handle"
    direction: DOWN
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip the intro"
    commands:
      - tapOn:
          point: 50%, 8%
- extendedWaitUntil:
    visible: "Intro 30 s"
    timeout: 10000
- stopApp
# Then listen.yaml, once per show, gives the stats something to count and Home
# what to continue (README).
