# Store screenshots, part 1: Hopp filled the way a listener would — Nodesignal
# and the shows its podroll recommends (as it stands, 2026-10-20), by their
# feed addresses in the Podcast Index (2026-11-11). English UI.
appId: ${APP_ID}
name: Store setup
---
- runFlow: ../flows/common/fresh.yaml
- runFlow:
    file: subscribe.yaml
    env:
      FEED: "https://serve.podhome.fm/rss/e8df0b13-47de-544a-99b7-ec7cbd960a16"
      SHOW: "Nodesignal - Deine Bitcoin-Frequenz"
- runFlow:
    file: subscribe.yaml
    env:
      FEED: "https://serve.podhome.fm/rss/537e4d76-e51c-5a01-a88d-83450d7cf7e8"
      SHOW: "Münzweg - der Bitcoin-Podcast"
- runFlow:
    file: subscribe.yaml
    env:
      FEED: "https://anchor.fm/s/68a48810/podcast/rss"
      SHOW: "Sound Money Bitcoin Podcast"
- runFlow:
    file: subscribe.yaml
    env:
      FEED: "https://honigdachs.podigee.io/feed/mp3"
      SHOW: "Honigdachs"
- runFlow:
    file: subscribe.yaml
    env:
      FEED: "https://serve.podhome.fm/rss/1240c5ad-724b-4443-8c5f-be0bcd2a850c"
      SHOW: "Bitcoin Socratic Seminar Online"
# Nodesignal's own playback, as the per-show page shows it: 1.3×, its intro skipped.
- tapOn: "Home"
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: "Playback"
    centerElement: true
- tapOn: "Playback"
- scrollUntilVisible:
    element: "Per show"
    centerElement: true
- tapOn: "Per show"
- extendedWaitUntil:
    visible: "Nodesignal.*"
    timeout: 15000
- tapOn: "Nodesignal.*"
- extendedWaitUntil:
    visible: "Skip the intro"
    timeout: 10000
- tapOn:
    text: "1.3×"
    below: "Speed"
    above: "Skip the intro"
- scrollUntilVisible:
    element: "Skip the outro"
- tapOn:
    text: "30 s"
    below: "Skip the intro"
    above: "Skip the outro"
- swipe:
    from: "Drag handle"
    direction: DOWN
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip the intro"
    commands:
      - tapOn:
          point: 50%, 8%
- extendedWaitUntil:
    visible: "Intro 30 s"
    timeout: 10000
- stopApp
# Then listen.yaml, once per show, gives the stats something to count and Home
# what to continue (README).
