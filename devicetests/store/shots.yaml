# Store screenshots, part 2: the views the stores show, in the app's language
# (English or German — labels match either). Runs on what setup.yaml left,
# with a wallet connected by hand for the boost, which is never sent.
appId: ${APP_ID}
name: Store screenshots
---
- launchApp:
    stopApp: true
- tapOn: "Home"
# The tab may still show a page from before (the person's, an episode's); a second tap is its start.
- runFlow:
    when:
      visible: "(Back|Zurück)"
    commands:
      - tapOn: "Home"
- extendedWaitUntil:
    visible: "Nodesignal-Talk - E298.*"
    timeout: 30000
# Home's line after an update ("What's new") is no part of the picture.
- runFlow:
    when:
      visible: "(Dismiss|Ausblenden)"
    commands:
      - tapOn: "(Dismiss|Ausblenden)"
- waitForAnimationToEnd
- takeScreenshot: 1-home

# The player on the first chapter, whose picture is the show's.
- tapOn: "Nodesignal-Talk - E298.*"
- tapOn:
    text: "(Play|Abspielen|Continue|Weiterhören).*"
    above: "(Show notes|Shownotes)"
- waitForAnimationToEnd
# The phone's mini player by its time, a large screen's player bar by "Open the player" (2026-11-04).
- runFlow: ../flows/common/open-player.yaml
- extendedWaitUntil:
    visible: "Boost"
    timeout: 15000
- tapOn:
    text: "(Chapters|Kapitel)"
    below: "Boost"
- tapOn: "Intro"
# The mini player's own "Pause" lies hidden beneath, over the chips.
- runFlow:
    when:
      visible: "Pause"
    commands:
      - tapOn:
          text: "Pause"
          above: "Boost"
- waitForAnimationToEnd
- takeScreenshot: 2-player

# A boost made ready — its button is never tapped. Only with a wallet (WALLET=yes).
- runFlow:
    when:
      true: ${WALLET == "yes"}
    commands:
      - tapOn: "Boost"
      - tapOn: "(Message|Nachricht) \\(optional\\)"
      - inputText: ${MESSAGE}
      - hideKeyboard
      - swipe:
          start: 50%, 75%
          end: 50%, 45%
          duration: 600
      - waitForAnimationToEnd
      - takeScreenshot: 3-boost
      # Above the sheet: its scrim closes it (its label follows the language).
      - tapOn:
          point: 50%, 8%

# A person in the episode, and every episode with them.
- tapOn:
    text: "(People|Personen)"
    below: "Boost"
- waitForAnimationToEnd
- tapOn:
    text: "(All episodes with|Alle Folgen mit) .*"
    index: 0
- extendedWaitUntil:
    visible: "(In your subscriptions|In deinen Abos)"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 12-person
- runFlow:
    when:
      visible: "(Close player|Player schließen)"
    commands:
      - tapOn: "(Close player|Player schließen)"

# The library, a Sovereigncast show and its community.
- tapOn: "(Library|Bibliothek)"
- waitForAnimationToEnd
- takeScreenshot: 4-library
# By its author: the playlist above the shows names the show on each of its episodes. Below the
# playlist and the downloads, scrolled to first.
- scrollUntilVisible:
    element: "Die Nodesignal Crew"
- tapOn: "Die Nodesignal Crew"
- extendedWaitUntil:
    visible: "(Episodes|Folgen)"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 5-show
- tapOn: "Community"
- extendedWaitUntil:
    visible: ".*sats"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 6-community

# Discover as a search for sats-taking shows: the live lists beside it
# (new in the index, popular) change by the hour and are no one's to vouch for.
- tapOn: "(Discover|Entdecken)"
- runFlow:
    when:
      visible: "(Clear|Löschen)"
    commands:
      - tapOn: "(Clear|Löschen)"
- tapOn: ".*(Value4Value only|Nur Value4Value)"
- tapOn: "(Search or feed address|Suchen oder Feed-Adresse)"
- inputText: "Bitcoin"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Bitcoin Socratic Seminar Online"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 7-discover

- tapOn: "(Settings|Einstellungen)"
- scrollUntilVisible:
    element: "(Privacy|Privatsphäre)"
- tapOn: "(Privacy|Privatsphäre)"
- waitForAnimationToEnd
- takeScreenshot: 8-privacy
- tapOn: "(Back|Zurück)"

# What was heard (listen.yaml), and a show's own playback (setup.yaml): both at the
# top of the settings, above Privacy.
- scrollUntilVisible:
    element: "(Listening stats|Hörstatistik)"
    direction: UP
    centerElement: true
- tapOn: "(Listening stats|Hörstatistik)"
- extendedWaitUntil:
    visible: "(Heard this month|Gehört diesen Monat)"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 10-stats
- tapOn: "(Back|Zurück)"
- scrollUntilVisible:
    element: "(Playback|Wiedergabe)"
    direction: UP
    centerElement: true
- tapOn: "(Playback|Wiedergabe)"
- scrollUntilVisible:
    element: "(Per show|Pro Show)"
    centerElement: true
- tapOn: "(Per show|Pro Show)"
- extendedWaitUntil:
    visible: "Nodesignal.*"
    timeout: 15000
- tapOn: "Nodesignal.*"
- extendedWaitUntil:
    visible: "(Skip the intro|Intro überspringen)"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 11-per-show
- pressKey: back
- runFlow:
    when:
      visible: "(Skip the intro|Intro überspringen)"
    commands:
      - tapOn:
          point: 50%, 8%
- tapOn: "(Back|Zurück)"
- tapOn: "(Back|Zurück)"
- tapOn: "(Back|Zurück)"

# Comments, read only: a V4V show whose episodes Fountain listeners comment
# on. Subscribed for that alone and unsubscribed again; a bot that repeats
# every boost with a long link is muted — without an identity only here.
- tapOn: "(Discover|Entdecken)"
- tapOn: "(Cancel|Abbrechen)"
- tapOn: "(Search or feed address|Suchen oder Feed-Adresse)"
- inputText: "Chad and Reeds"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Chad and Reeds Podcast"
    timeout: 30000
- tapOn: "Chad and Reeds Podcast"
- runFlow:
    when:
      visible: "(Subscribe|Abonnieren)"
    commands:
      - tapOn: "(Subscribe|Abonnieren)"
- extendedWaitUntil:
    visible: ".*(Subscribed|Abonniert).*"
    timeout: 60000
- waitForAnimationToEnd
# Subscribed before (a run cut off before its clean-up), the search opens the preview, whose episodes
# open nothing and have no menu: "✓ Subscribed" opens the show.
- runFlow:
    when:
      notVisible: "(More|Mehr)"
    commands:
      - tapOn: ".*(Subscribed|Abonniert).*"
      - waitForAnimationToEnd
- tapOn: "009. yawn-boarding"
- tapOn:
    text: "(Play|Abspielen|Continue|Weiterhören).*"
    above: "(Show notes|Shownotes)"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 30000
- runFlow: ../flows/common/open-player.yaml
- extendedWaitUntil:
    visible: "Boost"
    timeout: 15000
- tapOn:
    text: "Pause"
    above: "Boost"
- swipe:
    start: 90%, 86%
    end: 10%, 86%
- swipe:
    start: 90%, 86%
    end: 10%, 86%
- tapOn:
    text: "(Comments|Kommentare)"
    below: "Boost"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "(Load comments|Kommentare laden)"
    commands:
      - tapOn: "(Load comments|Kommentare laden)"
- extendedWaitUntil:
    notVisible: "(Asking the relays|Frage die Relays).*"
    timeout: 45000
- runFlow:
    when:
      visible: "Boostr_Bot"
    commands:
      # On a tablet the comments fill the episode's page and the bot's
      # menu lies below the edge: the list moves up, its first menu is the bot's.
      - runFlow:
          when:
            notVisible: "⋯"
          commands:
            - swipe:
                start: 25%, 85%
                end: 25%, 55%
      - tapOn:
          text: "⋯"
          index: 0
      - tapOn: "(Mute Boostr_Bot|Boostr_Bot stummschalten)"
      - runFlow:
          when:
            notVisible: "(Drag handle|Ziehpunkt)"
          commands:
            - swipe:
                start: 25%, 40%
                end: 25%, 95%
            - swipe:
                start: 25%, 40%
                end: 25%, 95%
# A phone shows them in a sheet: pulled up whole.
- runFlow:
    when:
      visible: "(Drag handle|Ziehpunkt)"
    commands:
      - swipe:
          from: "(Drag handle|Ziehpunkt)"
          direction: UP
- waitForAnimationToEnd
- takeScreenshot: 9-comments
- runFlow:
    when:
      visible: "(Drag handle|Ziehpunkt)"
    commands:
      - pressKey: back
      - tapOn:
          point: 50%, 8%
- tapOn: "(Close player|Player schließen)"
# The show through Discover's search (its preview, then the show by "✓ Subscribed"): in the library
# its new episode, downloaded meanwhile, bears its name above the shows (2026-11-04).
- tapOn: "(Discover|Entdecken)"
- runFlow:
    when:
      visible: "(Cancel|Abbrechen)"
    commands:
      - tapOn: "(Cancel|Abbrechen)"
- tapOn: "(Search or feed address|Suchen oder Feed-Adresse)"
- inputText: "Chad and Reeds"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Chad and Reeds Podcast"
    timeout: 30000
- tapOn: "Chad and Reeds Podcast"
- tapOn: ".*(Subscribed|Abonniert)"
- waitForAnimationToEnd
- tapOn: ".*(Subscribed|Abonniert)"
- extendedWaitUntil:
    visible: "(Unsubscribe|Abo beenden)"
    timeout: 10000
- tapOn: "(Unsubscribe|Abo beenden)"
