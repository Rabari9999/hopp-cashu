# Store screenshots, part 1b: one episode of a show playing, for the stats and
# the playlist — SHOW is the show's title, EPISODE its episode's (a
# pattern, the first match is taken), QUERY what the show's search is given
# when the episode lies further down. Left playing; README says for how long.
appId: ${APP_ID}
name: Store listening
---
- launchApp
# The show through Discover's search: in the library the playlist above the shows names the show on
# each of its episodes (store screenshots 2026-11-04).
- tapOn: "Discover"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- tapOn: "Search or feed address"
- inputText: ${SHOW}
- pressKey: Enter
# The second match: the first is the search field itself, which holds the name now.
- extendedWaitUntil:
    visible:
      text: ${SHOW}
      index: 1
    timeout: 30000
- tapOn:
    text: ${SHOW}
    index: 1
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 15000
# From the search a show opens as its preview, whose episodes open nothing; "✓ Subscribed" opens the show.
- tapOn: ".*Subscribed.*"
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${QUERY != ""}
    commands:
      - scrollUntilVisible:
          element: "Search episodes"
          centerElement: true
      - tapOn: "Search episodes"
      - inputText: ${QUERY}
      - pressKey: Enter
- scrollUntilVisible:
    element: ${EPISODE}
- tapOn:
    text: ${EPISODE}
    index: 0
- extendedWaitUntil:
    visible: "Show notes"
    timeout: 15000
- tapOn:
    text: "(Play|Continue).*"
    above: "Show notes"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 30000
- pressKey: home
