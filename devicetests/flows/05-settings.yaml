# Every settings page the listener reaches without a wallet or an identity.
appId: ${APP_ID}
name: Settings
---
- launchApp
# Home lays itself out again while its feeds load: settled first, tapped again if nothing changed
# (device check 2026-10-22).
- waitForAnimationToEnd
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Playback"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 05-settings
- scrollUntilVisible:
    element: "Playback"
- tapOn: "Playback"
- waitForAnimationToEnd
- takeScreenshot: 05-playback
- tapOn: "Back"
- scrollUntilVisible:
    element: "Notifications"
- tapOn: "Notifications"
- waitForAnimationToEnd
- takeScreenshot: 05-notifications
- tapOn: "Back"
- scrollUntilVisible:
    element: "Wallet & payments"
    direction: UP
- tapOn: "Wallet & payments"
- waitForAnimationToEnd
- takeScreenshot: 05-wallet
- tapOn: "Back"
- scrollUntilVisible:
    element: "Nostr identity"
- tapOn: "Nostr identity"
- waitForAnimationToEnd
- takeScreenshot: 05-nostr
- tapOn: "Back"
- scrollUntilVisible:
    element: "Privacy"
- tapOn: "Privacy"
- waitForAnimationToEnd
- takeScreenshot: 05-privacy
