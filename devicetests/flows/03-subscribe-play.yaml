# A show found by name, looked at, subscribed; an episode played in the full player.
appId: ${APP_ID}
name: Subscribe and play
---
- runFlow: common/fresh.yaml
- tapOn: "Discover"
- tapOn: "Search or feed address"
- inputText: "Nodesignal"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Nodesignal - Deine Bitcoin-Frequenz"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 03-search
- tapOn: "Nodesignal - Deine Bitcoin-Frequenz"
- extendedWaitUntil:
    visible: "Subscribe"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 03-show-preview
- tapOn: "Subscribe"
- extendedWaitUntil:
    visible: ".*Subscribed.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 03-show-subscribed
# An episode not downloaded: its page, then streamed. Found by the show's own search, not by
# scrolling: a Release Boosting card pushes the list down, and on a tablet on its side a swipe
# in the screen's middle moves the episode pane, not the list (device check 2026-10-28).
- scrollUntilVisible:
    element: "Search episodes"
    centerElement: true
- tapOn: "Search episodes"
- inputText: "E297"
- pressKey: Enter
- scrollUntilVisible:
    element: "Nodesignal-Talk - E297.*"
- tapOn: "Nodesignal-Talk - E297.*"
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 03-episode
# The page's own button: in two panes the list beside it has play buttons too.
- tapOn:
    text: "Play"
    above: "Show notes"
- takeScreenshot: 03-stream-starting
- extendedWaitUntil:
    visible:
      text: "Pause"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 03-mini-player
# The full player: speed, the chips, the comments.
# Over Discover: the episode's page below the player has a "Comments" tab of its own, and a tap
# meant for the player's went through to it — on a tablet onto the player's progress (device
# check 2026-11-04).
- tapOn: "Discover"
- runFlow: common/open-player.yaml
# The speed is found by its description: iOS reports that, not the "1×" it shows.
- extendedWaitUntil:
    visible: "Playback speed"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 03-player
- tapOn: "Playback speed"
- takeScreenshot: 03-player-speed
# The chips scroll sideways; Comments is the last one. On a phone on its side
# they lie below the controls.
# Centred: at the bottom edge, on a phone on its side, a swipe on the chips began in the system's
# gesture area and moved nothing (device check 2026-11-04).
- scrollUntilVisible:
    element: "Chapters"
    centerElement: true
# Only where Comments lies beyond the edge: on a tablet every chip is there, and a swipe beside
# them moved the player instead (device check 2026-11-04).
- runFlow:
    when:
      notVisible: "Comments"
    commands:
      - swipe:
          from: "Chapters"
          direction: LEFT
      # A swipe on iOS moves the row less far; a second one at its end does nothing.
      - swipe:
          from: "Transcript"
          direction: LEFT
- tapOn:
    text: "Comments"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Load comments"
    timeout: 10000
- takeScreenshot: 03-comments-closed
- tapOn: "Load comments"
- extendedWaitUntil:
    notVisible: "Asking the relays.*"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: 03-comments
# Only reading: no identity here, so nothing is ever published from a test.
